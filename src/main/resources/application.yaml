spring:
  application:
    name: ticketing
  
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ticketing
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled : true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60